<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardins du Paradis</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--green:#1a3c34;
--gold:#c5a059;
}

body{
margin:0;
font-family:'Tajawal',sans-serif;
background:#f9f9f9;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 5%;
background:white;
position:sticky;
top:0;
z-index:1000;
}

nav img{height:45px}

nav a{
text-decoration:none;
color:var(--green);
font-weight:bold;
margin:0 10px;
font-size:13px;
}

/* HERO */
.hero{
height:50vh;
background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url('images/hero-bg.jpg');
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.hero h1{font-size:38px}

.hero p{margin-top:10px}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 20px;
border-radius:20px;
text-decoration:none;
font-weight:bold;
}

.btn-main{background:var(--gold);color:white}
.btn-outline{border:2px solid white;color:white}

/* GRID */
.section-title{
text-align:center;
margin:40px 0;
font-size:26px;
color:var(--green);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:0 8%;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
text-align:center;
padding-bottom:15px;
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.price{color:var(--gold);font-weight:bold}

.badge{
position:absolute;
top:10px;
left:10px;
background:var(--gold);
color:white;
font-size:10px;
padding:3px 8px;
border-radius:5px;
}

/* BUTTON */
.order-btn{
display:inline-block;
margin-top:10px;
background:var(--green);
color:white;
padding:8px 15px;
border-radius:20px;
text-decoration:none;
font-size:13px;
}

/* WHATSAPP FLOAT */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
font-size:28px;
padding:15px;
border-radius:50%;
z-index:2000;
}

/* FOOTER */
footer{
background:var(--green);
color:white;
text-align:center;
padding:30px;
margin-top:50px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<img src="images/logo.png">
<div>
<a href="#">Accueil</a>
<a href="#plants">Plantes</a>
<a href="#bouquets">Bouquets</a>
</div>
</nav>

<!-- HERO -->
<div class="hero">
<div>
<h1>🌿 Jardins du Paradis</h1>
<p>Plantes • Décoration • Bouquets à Tanger</p>
<a href="#plants" class="btn btn-outline">Voir Catalogue</a>
<a href="https://wa.me/212661722457" class="btn btn-main">Commander</a>
</div>
</div>

<!-- PLANTS -->
<h2 class="section-title" id="plants">Nos Plantes</h2>
<div class="grid" id="plants-container"></div>

<!-- BOUQUETS -->
<h2 class="section-title" id="bouquets">Bouquets</h2>
<div class="grid" id="bouquets-container"></div>

<!-- FOOTER -->
<footer>
<p>📍 Tanger | 📞 0661722457</p>
<p>© Jardins du Paradis 2026</p>
</footer>

<!-- WHATSAPP FLOAT -->
<a href="https://wa.me/212661722457" class="whatsapp">
<i class="fab fa-whatsapp"></i>
</a>

<script>
const plants = [
{name:"Monstera",price:"120 DH",img:"images/plant1.jpg"},
{name:"Ficus",price:"150 DH",img:"images/plant2.jpg"},
{name:"Palmier",price:"200 DH",img:"images/plant3.jpg"}
];

const bouquets = [
{name:"Bouquet Rouge",price:"200 DH",img:"images/fleur1.jpg"},
{name:"Bouquet Blanc",price:"180 DH",img:"images/fleur2.jpg"}
];

function createCard(item){
return `
<div class="card">
<span class="badge">Nouveau</span>
<img src="${item.img}">
<h3>${item.name}</h3>
<p class="price">${item.price}</p>
<a href="https://wa.me/212661722457?text=Je veux commander ${item.name}" class="order-btn">
Commander
</a>
</div>
`;
}

document.getElementById('plants-container').innerHTML = plants.map(createCard).join('');
document.getElementById('bouquets-container').innerHTML = bouquets.map(createCard).join('');
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardins du Paradis | Luxe & Nature</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --main-green: #1a3c34; 
            --gold-accent: #c5a059; 
            --bg-light: #fdfdfd;
            --text-dark: #2c2c2c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; color: var(--text-dark); background-color: var(--bg-light); line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }

        /* Navigation */
        nav { 
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; 
            background: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .logo img { height: 60px; cursor: pointer; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { 
            text-decoration: none; color: var(--main-green); font-size: 15px; font-weight: 500; 
            text-transform: uppercase; cursor: pointer; position: relative; padding-bottom: 5px;
        }
        .nav-links a::after {
            content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 0;
            background-color: var(--gold-accent); transition: width 0.3s ease;
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        /* Sections */
        .page-section { display: none; padding-bottom: 80px; min-height: 100vh; }
        .page-section.active { display: block; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }

        /* Hero */
        .hero { 
            height: 60vh; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('images/hero-bg.jpg'); 
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white;
        }
        .hero-content h1 { font-family: 'Playfair Display', serif; font-size: clamp(30px, 6vw, 60px); text-align: center; letter-spacing: 2px; }

        /* Grid & Cards */
        .section-title { text-align: center; margin: 60px 0 40px; font-family: 'Playfair Display', serif; font-size: 32px; color: var(--main-green); }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; padding: 0 10%; }
        
        .item-card { 
            background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 30px rgba(0,0,0,0.05);
            transition: 0.4s; text-align: center; padding-bottom: 25px; cursor: pointer; border: 1px solid #f0f0f0;
        }
        .item-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .item-card img { width: 100%; height: 280px; object-fit: cover; }
        .price { color: var(--gold-accent); font-weight: bold; display: block; margin: 20px 0; }

        /* Jardinage Masonry */
        .jardinage-masonry { column-count: 3; column-gap: 20px; padding: 0 10%; }
        .jardinage-item { margin-bottom: 20px; break-inside: avoid; border-radius: 15px; overflow: hidden; position: relative; }
        .jardinage-item img { width: 100%; display: block; transition: 0.5s; }
        .jardinage-item:hover img { transform: scale(1.1); }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
        .modal-content { background: white; margin: 5vh auto; padding: 40px; border-radius: 20px; width: 90%; max-width: 800px; position: relative; display: flex; flex-wrap: wrap; gap: 30px; }
        .close { position: absolute; right: 25px; top: 15px; font-size: 35px; cursor: pointer; color: var(--main-green); }
        .modal-left { flex: 1; min-width: 300px; }
        .modal-left img { width: 100%; border-radius: 15px; height: 400px; object-fit: cover; }
        .modal-right { flex: 1.2; text-align: left; }
        
        /* Liste Détails Modal */
        .details-list { list-style: none; margin: 20px 0; }
        .details-list li { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .details-list i { color: var(--gold-accent); margin-right: 10px; width: 20px; }

        /* Buttons */
        .btn-main { background: var(--main-green); color: white; padding: 12px 25px; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: bold; border: none; cursor: pointer; }

        footer { background: var(--main-green); color: white; padding: 60px 10%; margin-top: 50px; text-align: center; }
        
        @media (max-width: 768px) { .jardinage-masonry { column-count: 1; } .modal-content { flex-direction: column; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showSection('accueil')"><img src="images/logo.png" alt="Logo"></div>
        <ul class="nav-links">
            <li><a onclick="showSection('accueil')" id="nav-accueil">accueil</a></li>
            <li><a onclick="showSection('plantes')" id="nav-plantes">plantes</a></li>
            <li><a onclick="showSection('bouquets')" id="nav-bouquets">bouquets</a></li>
            <li><a onclick="showSection('jardinage')" id="nav-jardinage">jardinage</a></li>
            <li><a onclick="showSection('contact')" id="nav-contact">contact</a></li>
        </ul>
    </nav>

    <div id="accueil" class="page-section active">
        <div class="hero">
            <div class="hero-content"><h1>JARDINS DU PARADIS</h1></div>
        </div>
        <div class="section-title">Aperçu de la Collection</div>
        <div class="catalog-grid" id="preview-grid"></div>
    </div>

    <div id="plantes" class="page-section">
        <div class="section-title">Toutes nos Plantes</div>
        <div class="catalog-grid" id="plantes-full-grid"></div>
    </div>

    <div id="bouquets" class="page-section">
        <div class="section-title">Nos Bouquets de Prestige</div>
        <div class="catalog-grid" id="bouquets-full-grid"></div>
    </div>

    <div id="jardinage" class="page-section">
        <div class="section-title">Nos Travaux</div>
        <div class="jardinage-masonry" id="jardinage-gallery"></div>
    </div>

    <div id="contact" class="page-section">
        <div class="section-title">Nous Trouver</div>
        <footer>
            <p>Hay Mandar Jamil, Tanger, Maroc</p>
            <p>06 61 72 24 57 / 06 61 06 41 17</p>
            <div style="margin-top:20px;">
                <a href="https://wa.me/212661722457" class="btn-main"><i class="fab fa-whatsapp"></i> Contactez-nous</a>
            </div>
        </footer>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-left"><img id="modalImg" src=""></div>
            <div class="modal-right">
                <h2 id="modalTitle" style="color:var(--main-green); font-family:'Playfair Display';"></h2>
                <span id="modalPrice" class="price" style="font-size: 22px;"></span>
                <ul class="details-list" id="modalDetails">
                    </ul>
                <a id="modalWa" href="#" class="btn-main" style="width:100%; text-align:center;">Commander sur WhatsApp</a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DONNÉES (Facile à modifier ici) ---
        const plantsData = [
            { name: 'ASPLENIUM', price: '100 DH', img: 'images/plant1.jpg', origin: 'Asie du Sud-Est', light: 'Tamisée', water: '1-2 fois/sem', soil: 'Humus', size: '30-50 cm' },
            { name: 'ALOCASIA POLLY', price: '100 DH', img: 'images/plant2.jpg', origin: 'Asie Tropicale', light: 'Vive', water: '1 fois/sem', soil: 'Drainé', size: '40-60 cm' },
            { name: 'FICUS ELASTICA', price: '100 DH', img: 'images/plant6.jpg', origin: 'Asie', light: 'Indirecte', water: '1 fois/sem', soil: 'Rapide', size: '60-100 cm' }
            // Ajoutez vos autres plantes ici...
        ];

        const bouquetsData = [
            { name: 'BOUQUET AMOUR', price: '150 DH', img: 'images/fleur1.jpg', desc: 'Roses rouges passionnées', occasion: 'Saint-Valentin' },
            { name: 'BOUQUET PASSION', price: '180 DH', img: 'images/fleur2.jpg', desc: 'Couleurs vives et chaleureuses', occasion: 'Célébrations' }
        ];

        // --- 2. FONCTIONS DE RENDU ---
        function createCard(item, type) {
            return `
                <div class="item-card" onclick="openItem(${JSON.stringify(item).replace(/"/g, '&quot;')}, '${type}')">
                    <img src="${item.img}" alt="${item.name}">
                    <h4>${item.name}</h4>
                    <span class="price">${item.price}</span>
                </div>`;
        }

        function showSection(id) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function openItem(item, type) {
            const modal = document.getElementById('itemModal');
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalImg').src = item.img;
            document.getElementById('modalPrice').innerText = item.price;
            document.getElementById('modalWa').href = `https://wa.me/212661722457?text=Bonjour, je souhaite commander : ${item.name}`;
            
            let detailsHtml = '';
            if(type === 'plant') {
                detailsHtml = `
                    <li><i class="fas fa-globe"></i> <strong>Origine:</strong> ${item.origin}</li>
                    <li><i class="fas fa-sun"></i> <strong>Lumière:</strong> ${item.light}</li>
                    <li><i class="fas fa-tint"></i> <strong>Arrosage:</strong> ${item.water}</li>
                    <li><i class="fas fa-seedling"></i> <strong>Sol:</strong> ${item.soil}</li>
                    <li><i class="fas fa-arrows-alt-v"></i> <strong>Taille:</strong> ${item.size}</li>`;
            } else {
                detailsHtml = `<li><i class="fas fa-info-circle"></i> ${item.desc}</li>
                               <li><i class="fas fa-gift"></i> Ideal pour: ${item.occasion}</li>`;
            }
            
            document.getElementById('modalDetails').innerHTML = detailsHtml;
            modal.style.display = "block";
        }

        function closeModal() { document.getElementById('itemModal').style.display = "none"; }

        // --- 3. INITIALISATION ---
        window.onload = () => {
            // Remplir Accueil (3 premières plantes)
            document.getElementById('preview-grid').innerHTML = plantsData.slice(0,3).map(p => createCard(p, 'plant')).join('');
            // Remplir Sections complètes
            document.getElementById('plantes-full-grid').innerHTML = plantsData.map(p => createCard(p, 'plant')).join('');
            document.getElementById('bouquets-full-grid').innerHTML = bouquetsData.map(b => createCard(b, 'flower')).join('');
            
            // Galerie Jardinage (Boucle pour images jardin1 à jardin23)
            let jardHtml = '';
            for(let i=1; i<=23; i++) {
                jardHtml += `<div class="jardinage-item"><img src="images/jardin${i}.jpg"></div>`;
            }
            document.getElementById('jardinage-gallery').innerHTML = jardHtml;
        };

        window.onclick = (e) => { if(e.target.className == 'modal') closeModal(); }
    </script>
</body>
</html>
